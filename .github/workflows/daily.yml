# Daily HR update — fetches new acts published in Narodne novine and
# commits them on top of main. Uses the workflow's default GITHUB_TOKEN
# to push back to legalize-hr (no PAT needed because we're pushing to
# the same repo the workflow runs in).
#
# State is inferred from the country repo's `git log` (most recent
# `Source-Date:` trailer) so no persistent state file is needed.

name: Daily HR update

on:
  schedule:
    # 14:00 UTC, Mon–Fri (15:00/16:00 Croatia depending on DST).
    # NN typically publishes the day's Službeni dio in the morning
    # Croatia time; this gives a comfortable buffer.
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to process (YYYY-MM-DD). Empty = automatic (10-day lookback cap from git history)."
        required: false
        type: string

# One run at a time. A second cron firing while the previous is still
# fetching would race on the push.
concurrency:
  group: daily-hr
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Country repo with full depth — the engine reads the most
      # recent `Source-Date:` trailer to know where to resume.
      - name: Checkout legalize-hr
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: country

      # Engine repo. The `config.yaml` at its root carries the HR
      # `countries:` section; the CLI loads it from cwd when invoked
      # without `--config`.
      - name: Checkout legalize-pipeline (engine)
        uses: actions/checkout@v4
        with:
          repository: norislav/legalize-pipeline
          ref: feat/hr-fetcher
          path: engine

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine
        working-directory: engine
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Configure git author identity (for commits in the country repo)
        working-directory: country
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run daily pipeline
        working-directory: engine
        env:
          INPUT_DATE: ${{ inputs.date }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          DATE_FLAG=""
          if [ -n "$INPUT_DATE" ]; then
            DATE_FLAG="--date $INPUT_DATE"
          fi
          legalize daily -c hr --repo-path ../country --push $DATE_FLAG
